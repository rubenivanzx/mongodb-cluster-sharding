version: '3.8'

networks:
  mongo-cluster-net:
    driver: bridge

services:
  # 1. SERVIDOR DE CONFIGURACIÓN (configsvr)
  configsvr:
    image: mongo:6.0
    container_name: configsvr
    command: mongod --configsvr --replSet configReplSet --port 27019 --bind_ip_all
    ports:
      - "27019:27019"
    networks:
      - mongo-cluster-net

  # 2. SHARDS (shard1, shard2, shard3)
  shard1:
    image: mongo:6.0
    container_name: shard1
    command: mongod --shardsvr --replSet shard1ReplSet --port 27018 --bind_ip_all
    ports:
      - "27018:27018"
    networks:
      - mongo-cluster-net

  shard2:
    image: mongo:6.0
    container_name: shard2
    command: mongod --shardsvr --replSet shard2ReplSet --port 27020 --bind_ip_all
    ports:
      - "27020:27020"
    networks:
      - mongo-cluster-net

  shard3:
    image: mongo:6.0
    container_name: shard3
    command: mongod --shardsvr --replSet shard3ReplSet --port 27021 --bind_ip_all
    ports:
      - "27021:27021"
    networks:
      - mongo-cluster-net

  # 3. MONGOS ROUTER
  mongos:
    image: mongo:6.0
    container_name: mongos
    command: mongos --configdb configReplSet/configsvr:27019 --bind_ip_all --port 27017
    ports:
      - "27017:27017"
    networks:
      - mongo-cluster-net
    depends_on:
      - configsvr
      - shard1
      - shard2
      - shard3